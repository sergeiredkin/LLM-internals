name: tinystories-rope-swiglu-gqa-shared-gpu

model:
  vocab_size: 8000
  context_length: 512
  n_layers: 8
  d_model: 512
  n_heads: 8
  n_kv_heads: 2
  mlp_ratio: 4.0
  mlp_type: swiglu
  swiglu_multiple_of: 16
  dropout: 0.1
  norm_eps: 1.0e-5
  bias: false
  tie_embeddings: true
  position_encoding: rope

data:
  input_path: data/tinystories/documents
  processed_dir: data/tinystories/processed
  tokenizer: bpe
  train_fraction: 0.9
  num_workers: 0

training:
  seed: 1337
  device: cuda
  precision: bf16
  # Low-memory profile for coexistence with the Ollama classifier.
  micro_batch_size: 4
  gradient_accumulation_steps: 8
  max_steps: 5000
  learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5
  warmup_steps: 200
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  eval_interval: 250
  eval_batches: 25
  log_interval: 10
  checkpoint_interval: 500
  step_idle_seconds: 0.05
  output_dir: runs/tinystories-rope-swiglu-gqa
