name: shakespeare-gpu-smoke

model:
  vocab_size: null
  context_length: 256
  n_layers: 6
  d_model: 384
  n_heads: 6
  n_kv_heads: 6
  mlp_ratio: 4.0
  dropout: 0.1
  norm_eps: 1.0e-5
  bias: false
  tie_embeddings: true
  position_encoding: learned

data:
  input_path: data/shakespeare/input.txt
  processed_dir: data/shakespeare/processed
  tokenizer: char
  train_fraction: 0.9
  num_workers: 0

training:
  seed: 1337
  device: cuda
  precision: bf16
  micro_batch_size: 8
  gradient_accumulation_steps: 2
  max_steps: 20
  learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5
  warmup_steps: 2
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  eval_interval: 10
  eval_batches: 3
  log_interval: 1
  checkpoint_interval: 10
  output_dir: runs/shakespeare-smoke
